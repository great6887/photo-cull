<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="照片篩選" />
<meta name="theme-color" content="#F6F7F9" />
<title>照片篩選工具</title>
<link rel="icon" href="icon-180.png" sizes="180x180" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root {
    --bg: #F6F7F9;
    --card: #FFFFFF;
    --border: rgba(15, 23, 42, 0.08);
    --text: #1A1D24;
    --muted: #6B7280;
    --accent: #2563EB;
    --accent-press: #1D4ED8;
    --keep: #16A34A;
    --del: #E5484D;
    --warn: #C4871A;
    --chip: #EEF0F3;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.06);
    --footer-bg: rgba(246, 247, 249, 0.94);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    --radius: 16px;
    --summary-h: 52px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue",
      "Noto Sans TC", "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden; max-width: 100vw;
  }
  body { padding-bottom: calc(108px + var(--safe-bottom)); }
  body.screen-home { padding-bottom: calc(24px + var(--safe-bottom)); }
  body.screen-finish { padding-bottom: calc(24px + var(--safe-bottom)); }
  body.screen-result { padding-top: calc(var(--summary-h) + var(--safe-top)); }
  .wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: 16px 14px 0; }
  h1 {
    font-size: 22px; margin: 12px 0 8px; font-weight: 700;
    text-align: center; letter-spacing: -0.02em;
  }
  .sub {
    color: var(--muted); font-size: 15px; line-height: 1.5;
    margin: 0 auto 0; text-align: center; max-width: 20em;
  }
  .notice {
    background: var(--chip); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; color: var(--muted); margin-bottom: 12px; line-height: 1.5;
    position: relative;
  }
  .notice strong { color: var(--warn); font-weight: 600; }
  .notice .hint-close {
    position: absolute; top: 6px; right: 6px; width: 44px; height: 44px;
    border: none; background: transparent; color: var(--muted); font-size: 20px;
    cursor: pointer; border-radius: 10px;
  }
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .btn, .file-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 12px 16px; border-radius: 14px; border: none;
    font-size: 16px; font-weight: 650; cursor: pointer; width: 100%;
    -webkit-appearance: none; appearance: none; color: inherit; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { background: var(--accent-press); }
  .btn-ghost {
    background: var(--chip); color: var(--text); border: 1px solid var(--border); font-weight: 600;
  }
  .btn-quiet {
    background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 600; font-size: 15px;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Home: thumb-zone pick, tiny 進階 at bottom */
  #homeScreen {
    min-height: calc(100dvh - 120px);
    display: flex; flex-direction: column;
  }
  .pick-hero {
    flex: 1; display: flex; align-items: center; justify-content: center;
    margin: 0; padding: 24px 0 12px;
  }
  .pick-hero .file-btn {
    min-height: 56px; font-size: 18px; border-radius: 18px;
    position: relative; overflow: hidden; box-shadow: var(--shadow);
    max-width: 320px; width: 100%;
  }
  .pick-hero .file-btn input {
    position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
  }
  .home-bottom {
    margin-top: auto; padding: 8px 0 calc(8px + var(--safe-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  .adv-link {
    display: inline-flex; align-items: center; justify-content: center;
    text-align: center; margin: 0; padding: 12px 16px;
    min-height: 44px; background: none; border: none; color: var(--muted);
    font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer; font-family: inherit;
  }
  .adv-panel { margin-top: 8px; width: 100%; }
  .slider-block { margin-top: 12px; }
  .slider-block label {
    display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 6px;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 12px; font-size: 15px; min-height: 44px;
  }
  .toggle {
    position: relative; width: 48px; height: 28px; flex-shrink: 0;
    background: var(--chip); border-radius: 999px; border: 1px solid var(--border); cursor: pointer;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--muted);
  }
  .badge-soon {
    font-size: 12px; background: var(--chip); color: var(--muted);
    padding: 2px 8px; border-radius: 999px; margin-left: 6px; border: 1px solid var(--border);
  }
  .progress-wrap { margin-top: 12px; width: 100%; }
  .progress { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s; }
  .status { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .progress-row { display: flex; gap: 8px; margin-top: 12px; }
  .progress-row .btn { flex: 1; min-height: 44px; }

  .section-title { font-size: 20px; font-weight: 700; margin: 8px 0 12px; letter-spacing: -0.02em; }
  .del-headline {
    font-size: 26px; font-weight: 800; margin: 4px 0 8px; letter-spacing: -0.03em; color: var(--del);
  }

  /* Sticky summary bar */
  .summary-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 35;
    height: calc(var(--summary-h) + var(--safe-top));
    padding: var(--safe-top) 10px 0;
    background: rgba(246, 247, 249, 0.94);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: none;
  }
  body.screen-result .summary-bar { display: block; }
  .summary-bar-inner {
    max-width: 480px; margin: 0 auto; height: var(--summary-h);
    display: flex; align-items: center; gap: 8px; padding: 0 4px;
  }
  #summaryCounts {
    flex: 1; min-width: 0; font-size: 15px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #summaryCounts strong { font-size: 17px; font-weight: 800; }
  #summaryCounts .c-keep strong { color: var(--keep); }
  #summaryCounts .c-del strong { color: var(--del); }
  #summaryCounts .c-total strong { color: var(--text); }
  .btn-more {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 22px; font-weight: 700; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .more-menu {
    position: absolute; top: calc(var(--summary-h) + var(--safe-top) - 4px); right: max(10px, calc(50% - 240px + 10px));
    min-width: 160px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 36;
  }
  .more-menu button {
    display: block; width: 100%; text-align: left; min-height: 44px;
    padding: 10px 12px; border: none; background: transparent; border-radius: 10px;
    font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; font-family: inherit;
  }
  .more-menu button:active { background: var(--chip); }

  .result-hint { margin: 10px 0 12px; padding-right: 44px; }
  #resultAdvPanel { margin-bottom: 10px; }

  .cards { display: flex; flex-direction: column; gap: 14px; }
  .group-block { display: flex; flex-direction: column; gap: 0; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; width: 100%; max-width: 100%; box-shadow: var(--shadow);
  }
  .card.keep { border-color: rgba(22, 163, 74, 0.35); }
  .card.delete { border-color: rgba(229, 72, 77, 0.35); }
  .thumb-wrap {
    position: relative; width: 100%; background: var(--chip);
    aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .thumb-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    position: absolute; inset: 0;
    opacity: 0;
  }
  .thumb-wrap img.is-ready {
    opacity: 1;
    transition: opacity 150ms ease-out;
  }
  .thumb-placeholder {
    color: var(--muted); font-size: 13px; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 8px; line-height: 1.35;
    background: #E8EAED; /* light-gray 4:3 plate — never an upscaled 256 */
  }
  .thumb-placeholder.reselect {
    color: var(--warn); font-weight: 600; font-size: 13px;
  }
  .choice-badge {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    font-size: 14px; font-weight: 800; line-height: 1;
    min-height: 32px; min-width: 44px; padding: 8px 12px;
    border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18); pointer-events: none;
  }
  .choice-badge.keep { background: var(--keep); color: #fff; }
  .choice-badge.delete { background: var(--del); color: #fff; }
  .tag-row {
    position: absolute; left: 10px; top: 10px; right: 56px;
    display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; z-index: 2;
  }
  .tag {
    font-size: 14px; font-weight: 800; padding: 6px 10px; border-radius: 999px;
    background: rgba(0,0,0,0.55); color: #fff;
  }
  .tag.best { background: rgba(22, 163, 74, 0.92); }
  .tag.manual { background: rgba(37, 99, 235, 0.92); }
  .meta { padding: 12px 14px 14px; }
  .fname { font-size: 15px; word-break: break-all; color: var(--text); margin-bottom: 6px; font-weight: 600; }
  .reason { font-size: 15px; line-height: 1.45; color: var(--muted); margin-bottom: 8px; }
  .scores { font-size: 14px; color: var(--muted); line-height: 1.4; margin-bottom: 10px; }
  .card-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .seg-switch {
    display: inline-flex; height: 44px; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); background: var(--chip); flex: 1; min-width: 160px; max-width: 260px;
  }
  .seg-opt {
    flex: 1; border: none; background: transparent; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; color: var(--muted); min-height: 44px;
  }
  .seg-opt.keep.on { background: var(--keep); color: #fff; }
  .seg-opt.del.on { background: var(--del); color: #fff; }
  .restore-link {
    border: none; background: none; color: var(--accent); font-size: 14px;
    font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer; padding: 8px 4px; min-height: 44px; font-family: inherit;
  }

  .expand-btn {
    width: 100%; margin-top: 8px; min-height: 48px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 15px; font-weight: 650; cursor: pointer; font-family: inherit;
    padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; box-shadow: var(--shadow);
  }
  .expand-btn .chevron {
    width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); transition: transform .15s; flex-shrink: 0; margin-right: 4px;
  }
  .expand-btn.open .chevron { transform: rotate(-135deg); margin-top: 6px; }
  .group-extras {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-top: 8px;
  }
  .group-extras.hidden { display: none !important; }
  .card-compact { box-shadow: none; }
  .card-compact .thumb-wrap { aspect-ratio: 1 / 1; border-radius: 0; }
  .card-compact .meta-compact { padding: 8px; }
  .card-compact .reason { font-size: 14px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-compact .seg-switch { max-width: none; width: 100%; height: 36px; min-width: 0; }
  .card-compact .seg-opt { min-height: 44px; font-size: 14px; }
  .card-compact .restore-link { min-height: 44px; font-size: 14px; padding: 8px 0; }
  .card-compact .choice-badge { min-height: 28px; min-width: 36px; font-size: 14px; font-weight: 800; padding: 6px 8px; top: 6px; right: 6px; }

  .footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--footer-bg); border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + var(--safe-bottom));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .footer::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 100%;
    height: 28px; pointer-events: none;
    background: linear-gradient(to top, var(--bg), transparent);
  }
  .footer-inner { max-width: 480px; margin: 0 auto; }
  .footer .btn { min-height: 56px; font-size: 17px; border-radius: 16px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 15px; }
  .finish-list { list-style: none; padding: 0; margin: 0; }
  .finish-list li {
    padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: 15px; word-break: break-all;
  }
  .hidden { display: none !important; }
  .del-segments { display: flex; flex-direction: column; gap: 14px; }
  .del-seg {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; width: 100%; max-width: 100%; min-width: 0; box-shadow: var(--shadow);
  }
  .del-seg-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 10px;
  }
  .del-seg-title { flex: 1; min-width: 0; }
  .del-seg-date { font-size: 16px; font-weight: 700; word-break: break-word; line-height: 1.3; }
  .del-seg-time { font-size: 14px; color: var(--muted); margin-top: 2px; font-weight: 500; }
  .count-chip {
    flex-shrink: 0; font-size: 14px; font-weight: 700; color: var(--accent);
    background: rgba(37, 99, 235, 0.1); border: 1px solid rgba(37, 99, 235, 0.22);
    padding: 6px 10px; border-radius: 999px; min-height: 28px;
    display: inline-flex; align-items: center;
  }
  .seg-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    width: 100%; max-width: 100%;
  }
  .seg-hour-div {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 10px;
    margin: 6px 0 2px; padding: 0; min-height: 28px;
    color: #6B7280; font-size: 14px; font-weight: 700; line-height: 1.2;
    pointer-events: none; user-select: none;
  }
  .seg-hour-div::before, .seg-hour-div::after {
    content: ""; flex: 1 1 auto; height: 1px; background: #D1D5DB; min-width: 12px;
  }
  .seg-hour-div span { flex: 0 0 auto; letter-spacing: 0.02em; }
  .seg-thumb { position: relative; width: 100%; border-radius: 8px; overflow: hidden; background: var(--chip); }
  .seg-thumb img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .seg-time {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: 14px; font-weight: 800; color: #fff; text-align: center;
    padding: 6px 2px 5px; background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.55) 55%, transparent 100%);
  }
  .seg-copy { margin-top: 12px; min-height: 44px; font-size: 15px; }
  .keep-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; min-height: 48px; padding: 10px 4px; border: none; background: transparent;
    font-size: 18px; font-weight: 700; color: var(--text); cursor: pointer; font-family: inherit;
  }
  .keep-toggle .chevron {
    width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); transition: transform .15s;
  }
  .keep-toggle.open .chevron { transform: rotate(-135deg); margin-top: 6px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(96px + var(--safe-bottom));
    transform: translateX(-50%); background: var(--text); color: #fff;
    padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 50;
    max-width: calc(100vw - 24px); text-align: center; pointer-events: none;
  }

  .amber-alert {
    background: #FFF7E8; border: 1px solid rgba(196, 135, 26, 0.35);
    color: #8A5A00; border-radius: 12px; padding: 12px 14px;
    margin: 0 0 12px; line-height: 1.45; font-size: 14px; font-weight: 600;
  }
  .amber-alert.hidden { display: none !important; }
  .amber-alert .alert-line { display: block; font-size: 14px; font-weight: 650; margin: 0; }
  .amber-alert .alert-line + .alert-line { margin-top: 6px; }
  .amber-alert .alert-files {
    margin: 8px 0 0; padding: 0; list-style: none; font-size: 14px; font-weight: 500;
  }
  .amber-alert .alert-files li {
    padding: 4px 0; word-break: break-all; color: #8A5A00; opacity: 0.9;
  }
  .only-bad-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin: 16px 0; box-shadow: var(--shadow);
  }
  .only-bad-panel.hidden { display: none !important; }
  .only-bad-panel h2 { font-size: 18px; margin: 0 0 10px; font-weight: 750; color: var(--text); }
  .only-bad-panel .alert-files { margin: 0; padding: 0; list-style: none; }
  .only-bad-panel .alert-files li {
    font-size: 14px; color: var(--muted); padding: 8px 0;
    border-top: 1px solid var(--border); word-break: break-all;
  }
  .only-bad-panel .alert-files li:first-child { border-top: none; }
  .more-thumbs-btn {
    grid-column: 1 / -1; width: 100%; min-height: 44px; margin-top: 2px;
    border-radius: 10px; border: 1px dashed var(--border); background: var(--chip);
    color: var(--text); font-size: 14px; font-weight: 650; cursor: pointer; font-family: inherit;
  }

  /* —— Full-image viewer (v8e) —— */
  body.viewer-open { overflow: hidden; touch-action: none; }
  body.viewer-open .viewer-page-chrome {
    visibility: hidden !important;
    pointer-events: none !important;
  }
  #viewer {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.92);
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #viewer.open { opacity: 1; pointer-events: auto; }
  #viewer.closing { opacity: 0; pointer-events: none; }
  #viewer .viewer-stage {
    flex: 1; position: relative; min-height: 0;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 8px calc(12px + 120px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; justify-content: center;
  }
  #viewer .viewer-backdrop-hit {
    position: absolute; inset: 0; z-index: 0;
  }
  #viewer .viewer-frame {
    position: relative; z-index: 1;
    max-width: calc(100% - 0px); max-height: 100%;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #viewer .viewer-ph {
    position: absolute; inset: 10% 8px;
    background: #E8EAED; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #6B7280; font-size: 14px; text-align: center; padding: 16px;
    z-index: 1;
  }
  #viewer .viewer-ph.hidden { display: none; }
  #viewer .viewer-ph.fallback {
    color: #C4871A; font-weight: 600;
    inset: auto 8px calc(130px + env(safe-area-inset-bottom, 0px)) 8px;
    top: auto; height: auto; min-height: 44px;
    background: rgba(232,234,237,.95); z-index: 4;
  }
  #viewer .viewer-stage { touch-action: none; }
  #viewer .viewer-img {
    position: relative; z-index: 2;
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    opacity: 0;
    transition: opacity 150ms ease-out;
    pointer-events: none;
    will-change: transform;
    transform-origin: 0 0;
    transform: translate3d(0px, 0px, 0) scale(1);
  }
  #viewer .viewer-img.is-ready { opacity: 1; }
  #viewer .viewer-img.zoom-anim {
    transition: opacity 150ms ease-out, transform 150ms ease-out;
  }
  #viewer .viewer-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 56px 8px 56px;
    text-align: center; pointer-events: none;
  }
  #viewer .viewer-count, #viewer .viewer-reason {

  let sharedThumbCtx = null;

  let sharedDisplayCtx = null;

    const sh = img.naturalHeight || img.height;
    const scale = Math.min(1, maxSide / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * scale));
    const h = Math.max(1, Math.round(sh * scale));

    const w = Math.max(1, Math.round(sw * scale));
    const h = Math.max(1, Math.round(sh * scale));

     * createImageBitmap(file) then drawImage-to-512 changes perceptual hashes by ~18–35 bits vs
     * v5's HTML Image → canvas@512 path, which caused ~388 keep/delete label flips in v6/v7.

      const metricsP = metricsViaWorker(imageData, analyzed.w, analyzed.h);

      const tScale = Math.min(1, THUMB_MAX / Math.max(analyzed.w, analyzed.h));
      const tw = Math.max(1, Math.round(analyzed.w * tScale));

      item.overPct = metrics.overPct; item.underPct = metrics.underPct;

      item.displayUrl = null;

  function thresholds() {
    return {
      sharpTh: +el.sharpSlider.value, overTh: +el.overSlider.value, underTh: +el.underSlider.value,
      hashTh: +el.hashSlider.value, timeTh: (+el.timeSlider.value) * 1000,
    };

  /** Flat/monotone only when brightness is normal AND texture/edge energy is very low. */
  function hasNormalBrightness(p, th) {
    const over = p.mean >= 200 || p.overPct >= th.overTh;
    const under = p.mean <= 45 || p.underPct >= th.underTh;
    return !over && !under;
  }
  function isLowTexture(p) {
    const stdLow = typeof p.grayStd === "number" && p.grayStd < 14;
    const edgeLow = typeof p.edgeEnergy === "number" ? p.edgeEnergy < 18 : (p.sharp < 25);
    // Two-color flats: low edge energy even if std a bit higher
    return (stdLow && edgeLow) || (edgeLow && p.sharp < 40 && (p.grayStd || 0) < 28);

    const over = p.mean >= 200 || p.overPct >= th.overTh;

    const flat = isFlatCandidate(p, th);
    const best = typeof p.groupBestSharp === "number" ? p.groupBestSharp : 0;
    // Absolute blur: flat/monotone texture suppresses (true solids are not "blur")
    const blurAbs = !over && !under && !flat && p.sharp < th.sharpTh;
    // Relative blur vs group best: do NOT let flat suppress — severe blur of a real photo
    // can look low-texture but must still be 「同組較模糊」 when grouped with a sharp peer
    const blurRel = !over && !under && best > th.sharpTh * 0.5 && p.sharp < best * 0.42;
    const blur = blurAbs || blurRel;
    const bad = over || under || blur; // flat alone is NOT bad
    return { blur: blur, flat: flat, over: over, under: under, bad: bad };

  function autoChoiceFor(p, groupSize, th) {
    if (groupSize > 1) return p.isBest ? "keep" : "delete";
    const q = isBadQuality(p, th);
    if (q.over || q.under) return "delete";
    if (q.flat) return "keep";
    return q.bad ? "delete" : "keep";
  }

  function exposureReason(q, p) {
    if (q.over && p.mean >= 220) return "明顯過曝";
    if (q.over) return "略微過曝";
    if (q.under && p.mean <= 25) return "明顯欠曝";
    if (q.under) return "略微欠曝";
    return "";
  }

  /** D: one-sentence reason — mark and reason never contradict */
  function computeReason(p, groupSize, th) {
    if (p.userTouched) {
      if (p.choice === "keep" && p.autoChoice === "delete") return "你手動保留";
      if (p.choice === "delete" && p.autoChoice === "keep") return "你手動刪除";
    }
    const q = isBadQuality(p, th);
    const exp = exposureReason(q, p);

    if (groupSize > 1) {
      if (p.isBest) {
        if (p.choice === "keep") {
          if (exp) return exp; // shouldn't normally keep over/under as best, but if so label exposure
          if (q.flat) return "畫面單調";
          return "同組最清晰";
        }
        return "你手動刪除";
      }
      // Non-best deleted: duplicate reason takes priority over 畫面單調
      if (p.choice === "delete") {
        if (exp) return exp;
        // In a multi-photo group, relative/absolute blur → 「同組較模糊」(not lone 「模糊」)
        if (q.blur) return "同組較模糊";
        return "與同組重複";
      }
      // Non-best but manually/kept
      if (exp) return exp;
      if (q.flat) return "畫面單調";
      return "同組非最佳";
    }

    // Single photo: exposure first, then flat, then blur
    if (exp) return exp;
    if (q.flat) return "畫面單調";

  /**
   * Truly textureless / near-uniform candidate (solid_gray/blue, e_exif6, flats).
   * Severe blurs can also look low-edge — they must NOT skip grouping if hash-similar
   * to another photo (see shouldSkipGrouping).
   */
  function isMonotoneSolid(p) {
    if (!p) return false;
    const edge = typeof p.edgeEnergy === "number" ? p.edgeEnergy : Math.sqrt(Math.max(0, p.sharp || 0));
    const std = typeof p.grayStd === "number" ? p.grayStd : 99;
    if (std < 6 && edge < 10) return true;
    if (edge < 4 && std < 15) return true;
    return false;

  function isSimilarPair(a, b, th) {
    const dist = hashDistance(a, b);

  /**
   * Skip grouping only when textureless AND not similar to any non-monotone image.
   * Similar-to-another-solid does not count — true solids stay singleton 「畫面單調」.
   * Similar-to-a-real-photo (e.g. severe blur ↔ sharp) keeps the blur in grouping.
   */
  function shouldSkipGrouping(p, all, th) {
    if (!isMonotoneSolid(p)) return false;
    for (let i = 0; i < all.length; i++) {
      const o = all[i];
      if (o === p) continue;
      if (isMonotoneSolid(o)) continue;
      if (isSimilarPair(p, o, th)) return false;
    }
    return true;
  }

  function recomputeGroupsAndLabels() {
    const th = thresholds();
    const analyzed = photos.filter(function (p) { return p.analyzed; });
    analyzed.forEach(function (p) { p.groupId = null; p.isBest = false; });
    // Precompute skip flags ONCE. Calling skip scans inside O(n²) caused ~27M hash compares
    // on qa1000 (≈22s). Same semantics as shouldSkipGrouping, O(solids×nonSolids) once.
    const mono = analyzed.map(function (p) { return isMonotoneSolid(p); });
    const nonMonoIdx = [];
    for (let i = 0; i < analyzed.length; i++) if (!mono[i]) nonMonoIdx.push(i);
    const skipGroup = new Array(analyzed.length);
    for (let i = 0; i < analyzed.length; i++) {
      if (!mono[i]) { skipGroup[i] = false; continue; }
      let skip = true;
      const p = analyzed[i];
      for (let k = 0; k < nonMonoIdx.length; k++) {
        const o = analyzed[nonMonoIdx[k]];
        if (o === p) continue;
        if (isSimilarPair(p, o, th)) { skip = false; break; }
      }
      skipGroup[i] = skip;
    }
    let gid = 0;
    for (let i = 0; i < analyzed.length; i++) {
      const a = analyzed[i];
      if (a.groupId != null) continue;
      a.groupId = gid;
      if (skipGroup[i]) { gid++; continue; }
      for (let j = i + 1; j < analyzed.length; j++) {
        const b = analyzed[j];
        if (b.groupId != null) continue;
        if (skipGroup[j]) continue;
        if (isSimilarPair(a, b, th)) b.groupId = gid;
      }
      gid++;
    }
    const byGroup = {};
    analyzed.forEach(function (p) {
      if (!byGroup[p.groupId]) byGroup[p.groupId] = [];
      byGroup[p.groupId].push(p);
    });
    const gkeys = Object.keys(byGroup);
    for (let gi = 0; gi < gkeys.length; gi++) {
      const g = byGroup[gkeys[gi]];
      g.sort(function (a, b) { return qualityScore(b) - qualityScore(a); });
      g[0].isBest = true;
      const bestSharp = Math.max.apply(null, g.map(function (x) { return x.sharp; }));
      g.forEach(function (x) { x.groupBestSharp = bestSharp; });
    }
    for (let i = 0; i < analyzed.length; i++) {
      const p = analyzed[i];
      const g = byGroup[p.groupId] || [p];
      p.groupSize = g.length;
      p.autoChoice = autoChoiceFor(p, g.length, th);
      if (!p.userTouched) p.choice = p.autoChoice;
      const q = isBadQuality(p, th);
      p.badQuality = q.bad;
      p.suggestDelete = p.choice === "delete";
      p.reason = computeReason(p, g.length, th);
    }
  }

  async function persistChoice(p) {
    const prev = (await idbGet(p.id)) || {};
    const payload = {
      choice: p.choice, userTouched: !!p.userTouched, ts: Date.now(),
      analysis: prev.analysis || null,
    };
    if (p.analyzed && p.hash && p.thumbBlob) {
      payload.analysis = {
        v: ANALYSIS_VERSION, sharp: p.sharp, mean: p.mean, overPct: p.overPct, underPct: p.underPct,
        grayStd: p.grayStd, edgeEnergy: p.edgeEnergy, flat: !!p.flat,
        hash: p.hash, aHash: p.aHash,
        thumbBlob: p.thumbBlob, displayBlob: p.displayBlob,
        captureMs: p.captureMs, dateSource: p.dateSource,

  }

  function keptPhotos() { return photos.filter(function (p) { return p.analyzed && p.choice === "keep"; }); }
  function deletedPhotos() { return photos.filter(function (p) { return p.analyzed && p.choice === "delete"; }); }

  function groupsOrdered() {
    const map = {};
    photos.filter(function (p) { return p.analyzed; }).forEach(function (p) {
      if (!map[p.groupId]) map[p.groupId] = [];
      map[p.groupId].push(p);
    });
    return Object.keys(map).map(Number).sort(function (a, b) {
      const ta = Math.min.apply(null, map[a].map(function (p) { return photoTime(p); }));
      const tb = Math.min.apply(null, map[b].map(function (p) { return photoTime(p); }));
      return ta - tb;
    }).map(function (gid) {
      const g = map[gid].slice().sort(function (a, b) {

        return qualityScore(b) - qualityScore(a);

      return { gid: gid, photos: g, best: g.find(function (p) { return p.isBest; }) || g[0] };

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function formatTimeTaipei(ms) {

  }
  function dayKeyTaipei(ms) {

      }).format(new Date(ms));

  function buildDeleteSegments(dels) {

    sorted.forEach(function (p) {

          endMs: photoTime(list[list.length - 1]),

          partLabel: "",

  function setupLazyThumbs(root) {
    if (thumbObserver) thumbObserver.disconnect();
    const imgs = root.querySelectorAll("img[data-pid][data-kind=\"display\"]");
    function reveal(img) {
      revealResultCardImg(img);
      // Keep observing until loaded so a recycled placeholder can retry; unobserve when ready
      if (img.getAttribute("data-loaded") === "1" && thumbObserver) thumbObserver.unobserve(img);
    }
    if (!("IntersectionObserver" in window)) {
      imgs.forEach(reveal);

    }
    thumbObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {

      });
    }, { rootMargin: "240px 0px", threshold: 0.01 });
    imgs.forEach(function (img) { thumbObserver.observe(img); });
  }

  /** Build seg-grid HTML. When photos.length > 60, insert hour dividers between thumbs. */
  function buildSegGridHtml(photos, opts) {
    opts = opts || {};

    const parts = [];

  let finishThumbObserver = null;
  function setupFinishLazyThumbs(root) {
    if (finishThumbObserver) finishThumbObserver.disconnect();
    const imgs = root.querySelectorAll("img[data-src], img[data-pid]");
    // Revive blob URLs for any data-src that was revoked
    root.querySelectorAll("img[data-pid]").forEach(function (img) {
      const pid = img.getAttribute("data-pid");
      const p = photos.find(function (x) { return x.id === pid; });
      if (!p) return;
      const url = ensureThumbUrl(p);
      if (!url) return;
      if (img.hasAttribute("data-src")) img.setAttribute("data-src", url);
      else if (!img.getAttribute("src")) img.setAttribute("data-src", url);
    });
    const lazyImgs = root.querySelectorAll("img[data-src]");
    if (!lazyImgs.length) return;
    if (!("IntersectionObserver" in window)) {
      lazyImgs.forEach(function (img) {
        const src = img.getAttribute("data-src");
        if (src) { img.src = src; img.removeAttribute("data-src"); }
      });
      return;
    }
    finishThumbObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        const img = entry.target;
        if (entry.isIntersecting) {
          const pid = img.getAttribute("data-pid");
          const p = pid ? photos.find(function (x) { return x.id === pid; }) : null;
          let src = img.getAttribute("data-src");
          if (p) src = ensureThumbUrl(p) || src;
          if (src) {
            img.src = src;
            img.removeAttribute("data-src");
          }
          finishThumbObserver.unobserve(img);
        } else if (img.src && img.getAttribute("data-pid")) {

          const pid = img.getAttribute("data-pid");

  async function waitIfPaused() {

  async function processFiles(fileList) {
    if (processing) return;
    processing = true; paused = false; pauseWaiters = [];
    el.btnPause.textContent = "暫停";
    const files = Array.prototype.slice.call(fileList).filter(function (f) {
      return f.type.indexOf("image/") === 0 || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name);
    });
    if (!files.length) {
      processing = false;
      alert("沒有可讀取的影像檔");
      return;
    }
    // Revoke prior blob URLs before dropping photo refs
    photos.forEach(revokeThumbUrl);
    liveThumbOrder.length = 0;
    displayLiveOrder.length = 0;
    displayEncodeQueue.length = 0;
    displayEncodeInflight = 0;
    photos = [];
    unreadableFiles = [];
    if (el.onlyBadPanel) { el.onlyBadPanel.classList.add("hidden"); el.onlyBadList.innerHTML = ""; }
    expandedSegThumbs = {};
    showFinish = false;
    expandedGroups = {};
    setScreen("home");
    el.progressBlock.classList.remove("hidden");
    el.advPanel.classList.add("hidden");
    el.progressBar.style.width = "0%";
    el.progressText.textContent = "0 / " + files.length + "（0%）";
    getMetricWorker();
    getEncodeWorker();
    getEncodeWorker();

    const t0 = performance.now();
    let skippedCache = 0, analyzedFresh = 0;

    for (let i = 0; i < files.length; i += BATCH) {
      await waitIfPaused();
      if (!processing) break;
      const chunk = files.slice(i, i + BATCH);
      await Promise.all(chunk.map(async function (file) {
        const id = fileKey(file.name, file.size, file.lastModified);
        const item = {
          id: id, file: file, name: file.name, size: file.size, lastModified: file.lastModified,
          captureMs: file.lastModified, dateSource: "file",
          thumbUrl: null, thumbBlob: null, displayUrl: null, displayBlob: null, sharp: 0, mean: 0, grayStd: 0, edgeEnergy: 0, flat: false, overPct: 0, underPct: 0, hash: "", aHash: "",
          groupId: null, isBest: false, choice: "keep", autoChoice: "keep", userTouched: false,
          reason: "", labels: [], suggestDelete: false, badQuality: false, analyzed: false,
          fromCache: false, groupSize: 1,
        };
        const saved = await idbGet(id);
        if (saved && saved.userTouched && (saved.choice === "keep" || saved.choice === "delete")) {
          item.choice = saved.choice; item.userTouched = true;
        } else if (saved && (saved.choice === "keep" || saved.choice === "delete")) {
          item.choice = saved.choice;
        }
        try {
          if (!file.size) throw new Error("empty");
          if (applyCachedAnalysis(item, saved)) skippedCache++;
          else { await analyzeOne(item); analyzedFresh++; }
        } catch (err) {
          console.warn(err); item.analyzed = false;
        }
        if (item.analyzed) photos.push(item);
        else unreadableFiles.push(file.name);
      }));
      const done = Math.min(i + BATCH, files.length);
      if (done === files.length || (i / BATCH) % 3 === 0) {
        const left = files.length - done;
        const pct = Math.round((done / files.length) * 100);
        el.progressBar.style.width = pct + "%";
        el.progressText.textContent = done + " / " + files.length + "（" + pct + "%）· 剩餘 " + left +
          " 張 · 快取 " + skippedCache;
      }
    }

    await Promise.all(photos.map(function (p) { return p._blobP || Promise.resolve(); }));
    photos.sort(function (a, b) {
      return a.lastModified - b.lastModified || a.name.localeCompare(b.name);
    });
    const ms = Math.round(performance.now() - t0);
    lastRunStats = { total: files.length, analyzedFresh: analyzedFresh, skippedCache: skippedCache, ms: ms,
      unreadable: unreadableFiles.length };
    paused = false;
    if (!photos.length) {
      el.progressBlock.classList.add("hidden");
      el.progressText.textContent = "";
      processing = false;
      render();
      return;
    }
    el.progressText.textContent = "整理分組中… · 剩餘 0 張";
    await yieldToUI();
    const persistEarly = (async function () {
      const entries = [];
      for (let pi = 0; pi < photos.length; pi++) {

    el.progressText.textContent = "完成 " + photos.length + " 張（100%）· 新分析 " + analyzedFresh +
      " · 快取 " + skippedCache + " · " + (ms / 1000).toFixed(1) + "s";
    if (unreadableFiles.length) {

    }
    await yieldToUI();
    const groups = groupsOrdered();
    setScreen("result");
    {
      const kept = keptPhotos();
      const dels = deletedPhotos();
      const total = photos.filter(function (p) { return p.analyzed; }).length;
      el.summaryCounts.innerHTML =
        '<span class="c-keep">留 <strong>' + kept.length + "</strong></span>" +
        '<span class="sep">　</span>' +
        '<span class="c-del">刪 <strong>' + dels.length + "</strong></span>" +
        '<span class="sep">　</span>' +
        '<span class="c-total">共 <strong>' + total + "</strong></span>";
      const hintDismissed = localStorage.getItem(HINT_KEY) === "1";

    } else {

  function resultListOrder() {

  function revokeViewerUrl(id) {
    const u = viewer.urls[id];
    if (u) {
      try { URL.revokeObjectURL(u); } catch (_) {}
      delete viewer.urls[id];
    }
  }

  function revokeFarViewerUrls() {
    const keep = {};
    for (let d = -1; d <= 1; d++) {
      const p = viewer.list[viewer.index + d];
      if (p) keep[p.id] = true;
    }
    Object.keys(viewer.urls).forEach(function (id) {
      if (!keep[id]) revokeViewerUrl(id);
    });
  }

  function originalUrlFor(p) {
    if (!p || !hasOriginalFile(p)) return null;
    if (viewer.urls[p.id]) return viewer.urls[p.id];
    const u = URL.createObjectURL(p.file);
    viewer.urls[p.id] = u;
    return u;

  async function loadViewerImage(p) {
    if (!p) return;
    viewer.loadingId = p.id;
    const img = vel.img;
    img.classList.remove("is-ready");
    // Missing original File: show 720/256 fallback blob WITH reselect message (never pretend it is the original)
    if (!hasOriginalFile(p)) {
      let fb = null;
      if (p.displayBlob) fb = URL.createObjectURL(p.displayBlob);
      else if (p.thumbBlob) fb = URL.createObjectURL(p.thumbBlob);
      showViewerPlaceholder("請重新選取照片以載入原圖", true);
      // Keep message visible overlay; still paint fallback underneath if available
      if (fb) {
        try {
          img.src = fb;
          if (typeof img.decode === "function") await img.decode();
          if (viewer.loadingId === p.id) img.classList.add("is-ready");
        } catch (_) {}
        // revoke ephemeral fallback URL after paint (not tracked in viewer.urls)
        setTimeout(function () { try { URL.revokeObjectURL(fb); } catch (_) {} }, 2000);
      }
      return;
    }
    showViewerPlaceholder("", false);
    const url = originalUrlFor(p);
    try {
      img.src = url;
      if (typeof img.decode === "function") await img.decode();
      else {
        await new Promise(function (resolve) {
          if (img.complete && img.naturalWidth) resolve();
          else { img.onload = function () { resolve(); }; img.onerror = function () { resolve(); }; }
        });
      }
      if (viewer.loadingId !== p.id || !viewer.open) return;
      vel.ph.classList.add("hidden");
      img.classList.add("is-ready");
      applyViewerTransform(false);
    } catch (_) {
      if (viewer.loadingId !== p.id) return;
      showViewerPlaceholder("請重新選取照片以載入原圖", true);
    }
  }

  function preloadViewerNeighbors() {
    [-1, 1].forEach(function (d) {
      const p = viewer.list[viewer.index + d];
      if (!p || !hasOriginalFile(p)) return;
      if (viewer.urls[p.id]) return;
      const u = originalUrlFor(p);
      const im = new Image();
      im.decoding = "async";
      im.src = u;
      if (typeof im.decode === "function") im.decode().catch(function () {});

    revokeFarViewerUrls();

  function applyViewerTransform(animate) {

  function viewerImgLayoutSize() {
    const img = vel.img;
    // untransformed layout size: temporarily clear transform
    const prev = img.style.transform;
    img.style.transform = "translate3d(0,0,0) scale(1)";
    const r = img.getBoundingClientRect();
    img.style.transform = prev;
    return { w: r.width, h: r.height, left: r.left, top: r.top };
  }

  function clampViewerPan() {
    const s = viewer.scale;
    if (s <= 1.001) {
      viewer.tx = 0; viewer.ty = 0; viewer.scale = 1;
      return;
    }
    const frame = viewerFrameRect();
    const img = vel.img;
    const prev = img.style.transform;
    img.style.transform = "translate3d(0,0,0) scale(1)";
    const base = img.getBoundingClientRect();
    img.style.transform = prev;
    const bw = base.width, bh = base.height;
    const sw = bw * s, sh = bh * s;
    // With transform-origin 0 0: visual top-left = (base.left + tx, base.top + ty) relative to viewport
    // Actually origin 0 0 means scale from top-left of element; element's layout top-left is base.left/top at identity.
    // After translate(tx,ty) scale(s) with origin 0 0: top-left at (layoutLeft+tx, layoutTop+ty), size sw x sh
    // We need layout position at scale 1 inside frame — use offset relative to frame
    const layoutLeft = base.left; // at identity, current scroll
    const layoutTop = base.top;
    // Recompute desired: keep image covering — edges don't leave viewport beyond bounds
    // Min tx: right edge >= frame.right → layoutLeft + tx + sw >= frame.right → tx >= frame.right - layoutLeft - sw
    // Max tx: left edge <= frame.left → layoutLeft + tx <= frame.left → tx <= frame.left - layoutLeft
    // If sw < frame.width, center-ish clamp to not leave gaps on both sides incorrectly:
    let minTx, maxTx, minTy, maxTy;
    if (sw <= frame.width) {
      // keep fully inside horizontally
      minTx = frame.left - layoutLeft;
      maxTx = frame.right - layoutLeft - sw;
      if (minTx > maxTx) { const m = (minTx + maxTx) / 2; minTx = maxTx = m; }
    } else {
      maxTx = frame.left - layoutLeft;
      minTx = frame.right - layoutLeft - sw;
    }
    if (sh <= frame.height) {
      minTy = frame.top - layoutTop;
      maxTy = frame.bottom - layoutTop - sh;
      if (minTy > maxTy) { const m = (minTy + maxTy) / 2; minTy = maxTy = m; }
    } else {
      maxTy = frame.top - layoutTop;
      minTy = frame.bottom - layoutTop - sh;
    }
    viewer.tx = Math.min(maxTx, Math.max(minTx, viewer.tx));
    viewer.ty = Math.min(maxTy, Math.max(minTy, viewer.ty));
  }

  function fitWidthScale() {
    const frame = viewerFrameRect();
    const img = vel.img;
    const prev = img.style.transform;
    img.style.transform = "translate3d(0,0,0) scale(1)";
    const base = img.getBoundingClientRect();
    img.style.transform = prev;
    if (!base.width) return 2;
    const s = frame.width / base.width;
    return s;
  }

  function zoomTo(scale, cx, cy, animate) {
    // cx,cy = viewport coords of focal point
    const img = vel.img;
    const prev = img.style.transform;
    img.style.transform = "translate3d(0,0,0) scale(1)";
    const base = img.getBoundingClientRect();
    img.style.transform = prev;
    const oldS = viewer.scale || 1;
    const newS = Math.min(viewer.maxScale, Math.max(1, scale));
    // Point in image local (origin top-left) under focal: ((cx - (base.left+tx))/oldS)
    const localX = (cx - (base.left + viewer.tx)) / oldS;
    const localY = (cy - (base.top + viewer.ty)) / oldS;
    viewer.scale = newS;
    viewer.tx = cx - base.left - localX * newS;
    viewer.ty = cy - base.top - localY * newS;
    clampViewerPan();
    applyViewerTransform(animate);
  }

  function viewerStep(delta) {
    if (!viewer.open) return;
    const ni = viewer.index + delta;

  (function bindViewerTouch() {
    const TAP_MAX = 12;
    const CLOSE_DY = 80;
    const DBL_MS = 300;
    let pointers = new Map(); // id -> {x,y}
    let mode = null; // 'pan' | 'pinch' | 'swipe' | null
    let pan0 = null; // {x,y,tx,ty}
    let pinch0 = null; // {dist, scale, tx, ty, midX, midY}
    let swipe0 = null; // {x,y}
    let lastTap = null; // {t,x,y}
    let rafPending = false;
    let latest = null;

    function clearGestures() {
      mode = null; pan0 = null; pinch0 = null; swipe0 = null;
      vel.root.style.transition = "";
    }

    function dist(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function mid(a, b) {
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    function scheduleApply() {
      latest = true;
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(function () {
        rafPending = false;
        if (!latest) return;
        latest = false;
        clampViewerPan();
        applyViewerTransform(false);
      });
    }

    function onDown(ev) {
      if (!viewer.open) return;
      if (ev.target.closest("button") || ev.target.closest(".seg-switch") || ev.target.closest(".viewer-bottom") || ev.target.closest(".viewer-top")) return;
      if (ev.pointerType === "mouse" && ev.button !== 0) return;
      try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (_) {}
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        pinch0 = {
          dist: dist(pts[0], pts[1]) || 1,
          scale: viewer.scale,
          tx: viewer.tx, ty: viewer.ty,
          mid: mid(pts[0], pts[1]),
        };
        mode = "pinch";
        pan0 = null; swipe0 = null;
        vel.root.style.transition = "none";
        vel.root.style.transform = "";
        vel.root.style.opacity = "";
      } else if (pointers.size === 1) {
        const p = pointers.values().next().value;
        if (viewer.scale > 1.01) {
          mode = "pan";
          pan0 = { x: p.x, y: p.y, tx: viewer.tx, ty: viewer.ty };
        } else {
          mode = "swipe";
          swipe0 = { x: p.x, y: p.y };
          vel.root.style.transition = "none";
        }
      }
    }

    function onMove(ev) {
      if (!viewer.open || !pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size >= 2) {
        const pts = Array.from(pointers.values()).slice(0, 2);
        if (!pinch0) {
          pinch0 = {
            dist: dist(pts[0], pts[1]) || 1,
            scale: viewer.scale,
            tx: viewer.tx, ty: viewer.ty,
            mid: mid(pts[0], pts[1]),
          };
        }
        mode = "pinch";
        if (ev.cancelable) ev.preventDefault();
        const d = dist(pts[0], pts[1]) || 1;
        const m = mid(pts[0], pts[1]);
        const newS = Math.min(viewer.maxScale, Math.max(1, pinch0.scale * (d / pinch0.dist)));
        // Keep midpoint stable relative to image
        const img = vel.img;
        const prev = img.style.transform;
        img.style.transform = "translate3d(0,0,0) scale(1)";
        const base = img.getBoundingClientRect();
        img.style.transform = prev;
        const oldS = pinch0.scale;
        const localX = (pinch0.mid.x - (base.left + pinch0.tx)) / oldS;
        const localY = (pinch0.mid.y - (base.top + pinch0.ty)) / oldS;
        viewer.scale = newS;
        viewer.tx = m.x - base.left - localX * newS;
        viewer.ty = m.y - base.top - localY * newS;
        scheduleApply();
        return;
      }
      if (mode === "pan" && pan0 && viewer.scale > 1.01) {
        if (ev.cancelable) ev.preventDefault();
        const p = pointers.values().next().value;
        viewer.tx = pan0.tx + (p.x - pan0.x);
        viewer.ty = pan0.ty + (p.y - pan0.y);
        scheduleApply();
        return;
      }
      if (mode === "swipe" && swipe0 && viewer.scale <= 1.01) {
        const p = pointers.values().next().value;
        const dx = p.x - swipe0.x;
        const dy = p.y - swipe0.y;
        if (Math.abs(dy) > Math.abs(dx) && dy > 0) {
          if (ev.cancelable) ev.preventDefault();
          const fade = Math.max(0.35, 1 - dy / 400);
          vel.root.style.transform = "translateY(" + dy + "px)";
          vel.root.style.opacity = String(fade);
        }
      }
    }

    function onUp(ev) {
      if (!pointers.has(ev.pointerId)) return;
      const up = pointers.get(ev.pointerId);
      pointers.delete(ev.pointerId);
      try { ev.currentTarget.releasePointerCapture(ev.pointerId); } catch (_) {}

      if (mode === "pinch") {
        if (pointers.size < 2) {
          clampViewerPan();
          applyViewerTransform(false);
          if (pointers.size === 1 && viewer.scale > 1.01) {
            const p = pointers.values().next().value;
            mode = "pan";
            pan0 = { x: p.x, y: p.y, tx: viewer.tx, ty: viewer.ty };
            pinch0 = null;
          } else {
            clearGestures();
          }
        }
        return;
      }

      if (mode === "pan") {
        clampViewerPan();
        applyViewerTransform(false);
        // Tiny movement while zoomed counts as tap — allow double-tap to reset to 1x
        if (pointers.size === 0 && pan0) {
          const pdx = up.x - pan0.x, pdy = up.y - pan0.y;
          if (Math.abs(pdx) < TAP_MAX && Math.abs(pdy) < TAP_MAX) {
            const now = performance.now();
            if (lastTap && now - lastTap.t < DBL_MS && Math.abs(up.x - lastTap.x) < TAP_MAX && Math.abs(up.y - lastTap.y) < TAP_MAX) {
              lastTap = null;
              resetViewerZoom(true);
            } else {
              lastTap = { t: now, x: up.x, y: up.y };
            }
          }
        }
        if (pointers.size === 0) clearGestures();
        return;
      }

      if (mode === "swipe" && swipe0 && viewer.scale <= 1.01) {
        const dx = up.x - swipe0.x;
        const dy = up.y - swipe0.y;
        vel.root.style.transition = "";
        const absX = Math.abs(dx), absY = Math.abs(dy);
        if (absX < TAP_MAX && absY < TAP_MAX) {
          // tap / double-tap
          const now = performance.now();
          if (lastTap && now - lastTap.t < DBL_MS && Math.abs(up.x - lastTap.x) < TAP_MAX && Math.abs(up.y - lastTap.y) < TAP_MAX) {
            lastTap = null;
            // toggle 1x <-> fit-width (or 2x)
            if (viewer.scale > 1.05) {
              resetViewerZoom(true);
            } else {
              let s = fitWidthScale();
              if (s <= 1.05) s = 2;
              s = Math.min(viewer.maxScale, s);
              zoomTo(s, up.x, up.y, true);
            }
          } else {
            lastTap = { t: now, x: up.x, y: up.y };
            // single tap on backdrop closes — if target is backdrop
            if (ev.target === vel.backdrop || ev.target.id === "viewerBackdrop") {
              setTimeout(function () {
                // if no double-tap followed
                if (lastTap && performance.now() - lastTap.t >= DBL_MS) {
                  lastTap = null;
                  if (viewer.scale <= 1.01) closeViewer();
                }
              }, DBL_MS + 10);
            }
          }
          vel.root.style.transform = "";
          vel.root.style.opacity = "";
          clearGestures();
          return;
        }
        if (absY > absX && dy > CLOSE_DY) {
          closeViewer();
          clearGestures();
          return;
        }
        if (absX > absY && absX >= 40) {
          if (dx <= -40) viewerStep(1);
          else if (dx >= 40) viewerStep(-1);
        }
        vel.root.style.transform = "";
        vel.root.style.opacity = "";
        clearGestures();
        return;
      }
      clearGestures();
    }

    const stage = vel.stage;
    if (stage) {
      stage.addEventListener("pointerdown", onDown);
      stage.addEventListener("pointermove", onMove);
      stage.addEventListener("pointerup", onUp);
      stage.addEventListener("pointercancel", onUp);
      // Prevent native gestures
      stage.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    }
  })();

      const gid = +expand.getAttribute("data-expand");
      expandedGroups[gid] = !expandedGroups[gid];
      renderResult();
      return;
    }
    const card = e.target.closest("[data-id]");
    if (!card) return;
    const p = photos.find(function (x) { return x.id === card.getAttribute("data-id"); });
    if (!p) return;
    const btn = e.target.closest("[data-act]");
    const act = btn ? btn.getAttribute("data-act") : null;
    // Tap card thumb (or 看大圖) opens viewer — not when hitting keep/delete/restore
    if (act === "view" || (!btn && e.target.closest(".thumb-wrap"))) {
      const block = card.closest(".group-block");
      const gid = block ? +block.getAttribute("data-gid") : p.groupId;
      const inExtras = !!(e.target.closest(".group-extras"));
      openViewer(p.id, { preferGroup: inExtras || (expandedGroups[gid] && (p.groupSize || 1) > 1), gid: gid });
      return;
    }
    if (!btn) return;
    if (act === "keep") { p.choice = "keep"; p.userTouched = true; }
    else if (act === "delete") { p.choice = "delete"; p.userTouched = true; }
    else if (act === "restore") {
      p.userTouched = false;
      p.choice = p.autoChoice;
    } else return;
    const th = thresholds();
    p.reason = computeReason(p, p.groupSize || 1, th);
    await persistChoice(p);
    renderResult();
  });

  el.btnRestoreAll.addEventListener("click", async function () {
    closeMoreMenu();
    photos.forEach(function (p) {
      if (!p.analyzed) return;
      p.userTouched = false;
      p.choice = p.autoChoice;
      p.reason = computeReason(p, p.groupSize || 1, thresholds());
    });
    for (const p of photos) { if (p.analyzed) await persistChoice(p); }
    showToast("已全部還原為自動建議");
    renderResult();
  });

  el.btnConfirm.addEventListener("click", function () {
    if (!photos.length) return;
    showFinish = true;
    render();
  });
  el.btnBackToCards.addEventListener("click", function () {
    showFinish = false;
    render();
  });
  el.delSegments.addEventListener("click", async function (e) {
    const more = e.target.closest("[data-more-seg]");
    if (more) {
      const idx = +more.getAttribute("data-more-seg");
      const segs = el.delSegments._segs || [];
      const seg = segs[idx];
      if (!seg) return;
      const grid = el.delSegments.querySelector('[data-seg-grid="' + idx + '"]');
      if (!grid) return;
      expandedSegThumbs[idx] = true;
      // Rebuild full grid so hour dividers insert correctly with lazy thumbs
      grid.innerHTML = buildSegGridHtml(seg.photos, { open: true, segIdx: idx });
      setupFinishLazyThumbs(grid);
      return;
    }

    const btn = e.target.closest("[data-copy-seg]");
    if (!btn) return;
    const segs = el.delSegments._segs || [];
    const seg = segs[+btn.getAttribute("data-copy-seg")];
    if (seg) await copyText(segmentCopyText(seg));
  });
  el.btnShare.addEventListener("click", async function () {
    const kept = keptPhotos();
    if (!kept.length) { alert("尚未選留任何照片"); return; }
    const files = kept.map(function (p) { return p.file; });
    try {
      if (navigator.canShare && navigator.canShare({ files: files })) {
        await navigator.share({ files: files, title: "已選留照片" }); return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
    alert("此瀏覽器不支援一次分享多個檔案。");
  });

  loadSettings();
  setScreen("home");

  window.__photoCull = {
    processFiles: processFiles,
    getPhotos: function () { return photos; },
    isProcessing: function () { return processing; },
    isPaused: function () { return paused; },
    getDisplayLiveCount: function () { return displayLiveOrder.length; },
    openViewer: function (id, opts) { openViewer(id, opts || {}); },
    closeViewer: function () { closeViewer(); },
    isViewerOpen: function () { return !!viewer.open; },
    getViewerLiveUrlCount: function () { return Object.keys(viewer.urls).length; },
    getViewerIndex: function () { return { index: viewer.index, n: viewer.list.length, id: viewer.list[viewer.index] && viewer.list[viewer.index].id }; },
    getViewerZoom: function () { return { scale: viewer.scale, tx: viewer.tx, ty: viewer.ty }; },
    viewerZoomTo: function (s, cx, cy) { zoomTo(s, cx, cy, false); },
    viewerResetZoom: function () { resetViewerZoom(false); },
    viewerStep: function (d) { viewerStep(d); },


    getDisplayQueueLength: function () { return displayEncodeQueue.length + displayEncodeInflight; },
    isReady: function () {
      if (processing) return false;
      if (photos.length > 0) return photos.every(function (p) { return p.analyzed; });
      // finished a run that yielded only unreadable files
      return !!(lastRunStats && lastRunStats.unreadable > 0);
    },
    getUnreadable: function () { return unreadableFiles.slice(); },
    getLastRunStats: function () { return lastRunStats; },
    buildDeleteSegments: buildDeleteSegments,
    segmentCopyText: segmentCopyText,
    recompute: function () { recomputeGroupsAndLabels(); render(); },
    render: render,
  };
})();
</script>
</body>
</html>
